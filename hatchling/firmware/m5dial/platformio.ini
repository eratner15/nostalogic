; Hatchling firmware for the M5Stack Dial (ESP32-S3, 8 MB flash, no PSRAM).
; Build:  make -C hatchling firmware      (writes the model header, then runs pio)
; Flash:  cd hatchling/firmware/m5dial && pio run -t upload
[env:m5dial]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
    -O2
    -I../../engine
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Dial@1.0.3
    m5stack/M5Unified@0.2.26
    m5stack/M5GFX@0.2.33
