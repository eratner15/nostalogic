name = "porchlight-guide"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Provisional codename. The brand name is a single constant in src/config.ts (Fork D).

[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "porchlight-guide-db"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"

[vars]
SITE_ENV = "production"
# ADMIN_TOKEN is a secret: wrangler secret put ADMIN_TOKEN
