# Routed deploy at ratlinks.com/tv. Same D1 database as wrangler.toml. Requires the ratlinks.com zone on the account.
name = "streetlights-tv"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
routes = [
  { pattern = "ratlinks.com/tv", zone_name = "ratlinks.com" },
  { pattern = "ratlinks.com/tv/*", zone_name = "ratlinks.com" },
]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "porchlight-guide-db"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_list"
migrations_dir = "migrations"

[vars]
SITE_ENV = "production"
BASE_PATH = "/tv"
