# Local development with a local D1 database: npx wrangler dev --config wrangler.local.toml
name = "streetlights-guide"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "porchlight-guide-db"
database_id = "local"
migrations_dir = "migrations"

[vars]
SITE_ENV = "development"
BASE_PATH = ""
