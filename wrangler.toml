name = "nostaldamus"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

# Canonical home: the subdomain. The old path route stays alive as a 301 in
# the worker so nothing shared earlier goes dead.
routes = [
  { pattern = "nostalogic.cafecito-ai.com", custom_domain = true },
  { pattern = "cafecito-ai.com/nostaldamus", zone_name = "cafecito-ai.com" },
  { pattern = "cafecito-ai.com/nostaldamus/*", zone_name = "cafecito-ai.com" },
]

[assets]
directory = "out"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "nostaldamus-db"
database_id = "1c94c92c-5013-413a-83d3-97207f122309"

# Secret (wrangler secret put, never here): ANTHROPIC_API_KEY. Without it the
# library and deterministic scoring work; Remix/Chat return a clear 503.
