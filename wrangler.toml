name = "nostaldamus"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

# Canonical home: the subdomain. The old path route stays alive as a 301 in
# the worker so nothing shared earlier goes dead.
routes = [
  { pattern = "nostalogic.cafecito-ai.com", custom_domain = true },
  { pattern = "cafecito-ai.com/nostaldamus", zone_name = "cafecito-ai.com" },
  { pattern = "cafecito-ai.com/nostaldamus/*", zone_name = "cafecito-ai.com" },
]

[assets]
directory = "out"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "nostaldamus-db"
database_id = "1c94c92c-5013-413a-83d3-97207f122309"
migrations_dir = "worker/migrations"

# Remix Studio images (posters, sizzle keyframes). Create once with:
#   npx wrangler r2 bucket create nostaldamus-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "nostaldamus-media"

# Secret (wrangler secret put, never here): ANTHROPIC_API_KEY. Without it the
# library and deterministic scoring work; Remix/Chat return a clear 503.

# Optional secret: REPORT_CHECKOUT_URL. When configured, successful $199
# brief intake redirects to hosted checkout; otherwise the team follows up manually.

# Revival Watch. Hourly: signal fetch. Monday 06:00 UTC hour: weekly ledger.
# The day check is in worker/index.ts scheduled(), not here (CF cron DOW 1 = Sunday).
[triggers]
crons = ["17 * * * *"]

# Secrets for Revival Watch (wrangler secret put, never here):
#   AGENT_TOKEN  - the Revival Watch agent; the same value lives in its vault.
#   ADMIN_TOKEN  - the /admin review page.
#   RESEND_API_KEY + DIGEST_EMAIL_TO - optional digest email.
#   OPENAI_API_KEY - Remix Studio posters and keyframes (gpt-image). Optional:
#                    without it the Studio falls back to an SVG poster and text cards.
